<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- templates/index.html -->
<h1>Калькулятор</h1>
<form method="post">
    {% csrf_token %}
    <input type="number" name="num1" required>
    <select name="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" name="num2" required>
    <button type="submit">=</button>
</form>

{% if result is not None %}
    <h2>Ответ: {{result}}</h2>
{% endif %}
</body>
</html>
